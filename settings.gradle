pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}


rootProject.name = 'tp-ingsis-interpreter'
include('parser', 'ast', 'token', 'interpreter', 'formatter', 'linter','cli', 'runner', 'common','lexer' )

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}
