/*
 * Archivo de convenciones comunes con Kotlin, Spotless y JaCoCo
 */

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.diffplug.spotless'
    id 'jacoco'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    constraints {
        implementation 'org.apache.commons:commons-text:1.12.0'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Toolchain para Java
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

spotless {
    kotlin {
        target '**/*.kt'
        targetExclude '**/build/**'
        ktlint('0.50.0')
    }
    kotlinGradle {
        target '**/*.kts'
        ktlint()
    }
}

tasks.named('test') {
    useJUnitPlatform()
    environment "BEST_FOOTBALL_CLUB", "River Plate"
    finalizedBy tasks.jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.1
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'spotlessCheck', 'jacocoTestCoverageVerification'
}



