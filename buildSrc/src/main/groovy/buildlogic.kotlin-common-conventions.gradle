/*
 * Archivo de convenciones comunes con Kotlin, Spotless y JaCoCo
 */

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'jacoco'
    id 'maven-publish'
    id "org.jlleitschuh.gradle.ktlint" apply true
}


repositories {
    mavenCentral()
}

dependencies {
    constraints {
        implementation 'org.apache.commons:commons-text:1.12.0'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ktlint {
    version.set("1.3.0")
    android.set(false)
    outputColorName.set("RED")
    ignoreFailures.set(false)
    filter {
        exclude("**/build/**")
        include("**/src/**/*.kt")
    }
}

tasks.named('test') {
    useJUnitPlatform()
    environment "BEST_FOOTBALL_CLUB", "River Plate"
    finalizedBy tasks.jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.8
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'ktlintCheck', 'jacocoTestCoverageVerification'
}



